# Checks every pull request and every push to main.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dart:
    name: Dart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.0
      - name: Install exiftool and poppler, for the photo metadata and PDF text tests
        run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl poppler-utils
      - run: dart pub get
      - name: Formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analysis
        run: dart analyze --fatal-infos
      - name: Tests
        run: dart test

  web:
    name: Browser code
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  format:
    name: Markdown and TypeScript formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
